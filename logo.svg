<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <!-- Hexagonal cube logo in brand blue -->
  <g fill="#0066cc">
    <!-- Top face of hexagon -->
    <polygon points="50,15 75,28 75,54 50,67 25,54 25,28"/>
    
    <!-- Left side face -->
